name: Build VM Images

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to build'
        required: true
        default: 'qemu'
        type: choice
        options:
        - qemu
        - virtualbox
      arch:
        description: 'Architecture'
        required: true
        default: 'amd64'
        type: choice
        options:
        - amd64
        - arm64

permissions:
  contents: write

jobs:
  build:
    name: Build VM Images
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils wget parted kpartx dosfstools cryptsetup

      # v0.4.0 embeds a Debian/Kali template with a hardcoded amd64 kernel.
      # Build from the pinned release with an architecture-aware kernel selection.
      - name: Check out d2vm source
        uses: actions/checkout@v4
        with:
          repository: linka-cloud/d2vm
          ref: v0.4.0
          path: .d2vm-src

      - name: Set up Go for d2vm
        uses: actions/setup-go@v5
        with:
          go-version-file: .d2vm-src/go.mod
          cache: false

      - name: Patch and install d2vm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          template = Path('.d2vm-src/templates/debian.Dockerfile')
          source = template.read_text()
          old = 'linux-image-amd64'
          if source.count(old) != 1:
              raise SystemExit('d2vm template changed; review the kernel workaround')
          template.write_text(source.replace(old, 'linux-image-$(dpkg --print-architecture)'))
          PY
          go -C .d2vm-src build -o "$RUNNER_TEMP/d2vm" ./cmd/d2vm
          sudo install -m 755 "$RUNNER_TEMP/d2vm" /usr/local/bin/d2vm

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: labenv
          file: labenv/Dockerfile.kali
          platforms: linux/${{ inputs.arch }}
          tags: labenv:vm-${{ inputs.arch }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create QCOW2 Disk
        working-directory: vms
        run: |
          BOOTLOADER="grub"
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            BOOTLOADER="grub-efi"
          fi
          
          sudo d2vm convert \
            --platform linux/${{ inputs.arch }} \
            --bootloader $BOOTLOADER \
            --network-manager netplan \
            --size 40G \
            --boot-size 512 \
            --password vagrant \
            --output disk-${{ inputs.arch }}.qcow2 \
            labenv:vm-${{ inputs.arch }}
          
          qemu-img convert -c -O qcow2 disk-${{ inputs.arch }}.qcow2 labenv-${{ inputs.arch }}.qcow2

      - name: Build VirtualBox Box
        if: inputs.provider == 'virtualbox' && inputs.arch == 'amd64'
        working-directory: vms/virtualbox
        run: |
          qemu-img convert -O vmdk ../labenv-amd64.qcow2 box.vmdk
          tar czfv labenv-virtualbox-amd64.box ./*

      - name: Upload Box File
        if: inputs.provider == 'virtualbox' && inputs.arch == 'amd64'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: boxes
          files: |
            vms/virtualbox/labenv-virtualbox-amd64.box

      - name: Upload QCOW2 Disk
        if: inputs.provider == 'qemu'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: boxes
          files: |
            vms/labenv-${{ inputs.arch }}.qcow2
